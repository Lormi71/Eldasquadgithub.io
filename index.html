<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Эпштейн Сервер</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #111;
    color: white;
}

/* ПЕРВЫЙ ЭКРАН */
.container {
    display: flex;
    height: 100vh;
}

/* Левая часть */
.left {
    width: 40%;
    background: #1c1c1c;
    padding: 20px;
    box-sizing: border-box;
}

.left img {
    width: 100%;
    border-radius: 10px;
}

/* Правая часть */
.right {
    width: 60%;
    position: relative;
}

.right img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

/* Текст */
.overlay {
    position: absolute;
    top: 20px;
    left: 20px;
}

.overlay h1 {
    font-size: 50px;
    color: orange;
}

/* КНОПКИ */
.join-btn {
    display: inline-block;
    margin-top: 15px;
    padding: 15px 25px;
    background: linear-gradient(45deg, orange, red);
    color: white;
    text-decoration: none;
    border-radius: 10px;
}

/* ГАЛЕРЕЯ */
.gallery {
    padding: 50px;
    background: #000;
    text-align: center;
}

.gallery h2 {
    font-size: 40px;
    margin-bottom: 30px;
    color: orange;
}

.gallery-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 20px;
}

.gallery-grid img {
    width: 100%;
    border-radius: 10px;
    transition: 0.3s;
}

.gallery-grid img:hover {
    transform: scale(1.05);
}
</style>
</head>

<body>

<!-- ПЕРВЫЙ ЭКРАН -->
<div class="container">

    <div class="left">
        <h2>Участники</h2>
        <img src="participants.png">

        <p>🔥 Сервер, где каждый становится ЭПШТЕЙНОМ</p>

        <a href="https://discord.gg/Yafvt7hs" target="_blank" class="join-btn">
            Войти в Елда Сквад
        </a>

        <a href="history.html" target="_blank" class="join-btn">
            История Миньёнов
        </a>
    </div>

    <div class="right">
        <img src="main.png">

        <div class="overlay">
            <h1>ЕЛДА СКВАД</h1>
        </div>
    </div>

</div>

<!-- ГАЛЕРЕЯ -->
<div class="gallery">
    <h2>ГАЛЕРЕЯ</h2>

    <div class="gallery-grid">
        <img src="art1.png">
        <img src="art2.png">
        <img src="art3.png">
        <img src="art4.png">
    </div>
</div>

</body>
</html>
